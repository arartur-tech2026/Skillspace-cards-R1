<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Человек и общество – Карточки</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --card-front-bg: #ffffff;
      --card-back-bg: #eff6ff;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-front-bg: #1e293b;
      --card-back-bg: #172554;
      --border-color: #334155;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --success: #34d399;
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; }

    .app-container {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-color) 0%, var(--card-front-bg) 100%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    /* Header */
    .header {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) {
      .header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .header-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem 0; }
    .header-subtitle { font-size: 0.875rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; margin: 0; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Typography & Icons */
    .icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
    .icon-sm { width: 1rem; height: 1rem; }
    .icon-lg { width: 1.75rem; height: 1.75rem; }
    .text-success { color: var(--success); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: var(--card-front-bg);
      color: var(--text-main);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-icon { padding: 0.5rem; border-radius: 0.5rem; }

    /* Horizontal Scroll Tabs */
    .tabs-wrapper {
      width: 100%;
      max-width: 800px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin-bottom: 2rem;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tabs {
      display: flex;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
    }
    .tab {
      white-space: nowrap;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: var(--card-front-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Status text */
    .status-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    /* Card */
    .card-wrapper {
      width: 100%;
      max-width: 600px;
      height: 320px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 2.5rem;
    }
    @media (min-width: 768px) { .card-wrapper { height: 384px; } }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 10px 25px var(--shadow-color);
      border-radius: 1rem;
    }
    .card-wrapper.flipped .card-inner { transform: rotateX(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      border-radius: 1rem;
      border-top: 4px solid;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .card-face::-webkit-scrollbar { width: 6px; }
    .card-face::-webkit-scrollbar-track { background: transparent; }
    .card-face::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }

    .card-front {
      background: var(--card-front-bg);
      border-top-color: var(--accent);
    }
    .card-back {
      background: var(--card-back-bg);
      border-top-color: var(--success);
      transform: rotateX(180deg);
    }

    .card-label {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-front .card-label { color: var(--accent); }
    .card-back .card-label { color: var(--success); }

    .card-content { 
      font-size: 1.25rem; 
      font-weight: 600; 
      line-height: 1.5; 
      width: 100%;
      margin: 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
      transition: font-size 0.2s ease;
    }
    @media (min-width: 768px) { .card-content { font-size: 1.5rem; } }
    .card-back .card-content { font-weight: 500; color: var(--text-main); }

    .card-hint {
      position: absolute;
      bottom: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      animation: pulse 2s infinite;
    }

    /* Стили для подсказки с номером темы на обратной стороне карточки */
    .card-topic-hint {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border-color);
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      justify-content: center;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    @media (min-width: 768px) { .controls { gap: 1.5rem; } }

    .btn-control {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--card-front-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-control:hover { transform: scale(1.05); border-color: var(--accent); }

    .btn-nav { width: 3rem; height: 3rem; }
    .btn-action { width: 3rem; height: 3rem; color: var(--text-muted); }
    .btn-action.active { background: var(--success); color: #fff; border-color: var(--success); }

    .btn-main {
      width: 3.5rem; height: 3.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      box-shadow: 0 4px 10px var(--shadow-color);
    }
    .btn-main:hover { background: var(--accent-hover); }
    @media (min-width: 768px) {
      .btn-nav, .btn-action { width: 3.5rem; height: 3.5rem; }
      .btn-main { width: 4rem; height: 4rem; }
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.125rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Библиотека inline SVG-иконок -->
  <svg style="display: none;">
    <defs>

  <div class="app-container">
    <!-- Шапка -->
    <div class="header">
      <div>
        <h1 class="header-title">Человек и общество</h1>
        <p class="header-subtitle" id="header-subtitle">
          <svg class="icon icon-sm text-success"><use href="#icon-check-circle"></use></svg>
          <span id="file-status-text">Встроена полная база: раздел 1 (97 терминов)</span>
        </p>
      </div>
      
      <div class="header-actions">
        <button class="btn btn-icon" id="btn-theme" title="Переключить тему">
          <svg class="icon"><use id="theme-icon-use" href="#icon-moon"></use></svg>
        </button>
        <button class="btn" id="btn-upload">
          <svg class="icon icon-sm"><use href="#icon-upload"></use></svg>
          Загрузить
        </button>
        <input type="file" accept=".csv" id="file-input" style="display: none;" />
      </div>
    </div>

    <!-- Навигация (вкладки) -->
    <div class="tabs-wrapper">
      <div class="tabs" id="tabs-container">
        <button class="tab active" data-tab="all" id="tab-all">Все термины (0)</button>
        <button class="tab" data-tab="learning" id="tab-learning">Осталось выучить (0)</button>
        <button class="tab" data-tab="learned" id="tab-learned">Выученные (0)</button>
      </div>
    </div>

    <!-- Карточка и элементы управления -->
    <div id="main-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="status-text" id="status-text">Карточка 1 из 0</div>

      <div class="card-wrapper" id="card-wrapper">
        <div class="card-inner">
          <div class="card-face card-front">
            <span class="card-label">Вопрос</span>
            <h2 class="card-content" id="card-question"></h2>
            <p class="card-hint">Нажмите, чтобы перевернуть</p>
          </div>
          <div class="card-face card-back">
            <span class="card-label">Ответ</span>
            <p class="card-content" id="card-answer"></p>
            <div class="card-topic-hint" id="card-topic-hint"></div>
          </div>
        </div>
      </div>

      <div class="controls" id="controls">
        <button class="btn-control btn-action" id="btn-shuffle" title="Перемешать все">
          <svg class="icon"><use href="#icon-shuffle"></use></svg>
        </button>
        <button class="btn-control btn-nav" id="btn-prev" title="Предыдущая">
          <svg class="icon"><use href="#icon-prev"></use></svg>
        </button>
        <button class="btn-control btn-main" id="btn-next" title="Следующая">
          <svg class="icon icon-lg"><use href="#icon-next"></use></svg>
        </button>
        <button class="btn-control btn-action" id="btn-check" title="Отметить как выученное">
          <svg class="icon"><use href="#icon-check"></use></svg>
        </button>
      </div>
    </div>

    <!-- Пустое состояние -->
    <div class="empty-state" id="empty-state">
      В этой категории пока нет карточек.
    </div>
  </div>

  <script>
    // База карточек, строго распределенная по всем 10 темам раздела (97 терминов)
    const defaultCards = [
      { id: '1', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Что такое общество в широком смысле слова?', answer: 'Это обособившаяся от природы, но тесно с ней связанная часть материального мира, включающая способы взаимодействия и формы объединения людей.' },
      { id: '2', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Из каких двух основных частей состоит окружающий нас материальный мир?', answer: 'Материальный мир состоит из природы и общества.' },
      { id: '3', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Как называется признак общества, выражающийся в его постоянном изменении и развитии под влиянием различных факторов?', answer: 'Динамичность.' },
      { id: '4', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'В чем проявляется такая характеристика общества, как «открытость»?', answer: 'В способности общества обмениваться информацией, ресурсами и культурными достижениями с внешней средой.' },
      { id: '5', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Как называется признак общества, означающий, что оно состоит из взаимосвязанных элементов (институтов, групп), образующих единую структуру?', answer: 'Системность.' },
      { id: '6', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Назовите основной способ ведения хозяйства в первобытном обществе.', answer: 'Охота, собирательство и натуральное хозяйство.' },
      { id: '7', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Каков основной регулятор общественных отношений в традиционном обществе?', answer: 'Традиции и обычаи, передающиеся из поколения в поколение.' },
      { id: '8', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Для какого типа общества характерна низкая социальная мобильность и преобладание аграрного уклада?', answer: 'Традиционное общество.' },
      { id: '9', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Что является экономической основой индустриального общества?', answer: 'Промышленный способ производства и массовое применение машинного труда.' },
      { id: '10', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Какой ресурс становится главным в постиндустриальном (информационном) обществе?', answer: 'Знания, информация и высокие технологии.' },
      { id: '11', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'В каком типе общества сфера услуг начинает играть ведущую роль, преобладая над производством товаров?', answer: 'В постиндустриальном (информационном) обществе.' },
      { id: '12', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Что такое природа в узком смысле?', answer: 'Весь материальный мир за исключением общества, естественная среда обитания человека.' },
      { id: '13', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Что такое социальный институт?', answer: 'Исторически сложившаяся устойчивая форма организации совместной деятельности людей, направленной на удовлетворение базовых потребностей.' },
      { id: '14', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Приведите примеры социальных институтов.', answer: 'Семья, государство, религия, образование, производство.' },
      { id: '15', topic: 'Тема 1. ЧТО ТАКОЕ ОБЩЕСТВО', question: 'Каковы основные функции социальных институтов?', answer: 'Удовлетворение потребностей, регуляция поведения, социализация, интеграция.' },
      { id: '16', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое общественный прогресс?', answer: 'Направление развития, для которого характерен переход от низшего к высшему, от простого к более сложному.' },
      { id: '17', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое общественный регресс?', answer: 'Направление развития от высшего к низшему, деградация, возврат к изжившим себя формам.' },
      { id: '18', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое эволюция?', answer: 'Постепенные, плавные изменения в обществе, не приводящие к быстрому качественному скачку.' },
      { id: '19', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое революция?', answer: 'Коренные, скачкообразные изменения всех или большинства сторон общественной жизни.' },
      { id: '20', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое реформа?', answer: 'Целенаправленное преобразование какой-либо стороны общественной жизни, проводимое государственной властью.' },
      { id: '21', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'В чем заключается противоречивость общественного прогресса?', answer: 'Развитие в одной сфере может сопровождаться деградацией в другой (например, рост технологий и ухудшение экологии).' },
      { id: '22', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое глобализация?', answer: 'Процесс всемирной экономической, политической и культурной интеграции и унификации.' },
      { id: '23', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Назовите позитивные последствия глобализации.', answer: 'Доступ к информации, объединение усилий для решения проблем, развитие международной торговли.' },
      { id: '24', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Назовите негативные последствия глобализации.', answer: 'Утрата культурной специфики, зависимость экономик, рост разрыва между богатыми и бедными странами.' },
      { id: '25', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Что такое глобальные проблемы?', answer: 'Совокупность проблем человечества, от решения которых зависит существование цивилизации.' },
      { id: '26', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'Назовите основные виды глобальных проблем.', answer: 'Экологические, демографические, угроза ядерной войны, международный терроризм, проблема «Север–Юг».' },
      { id: '27', topic: 'Тема 2. ОБЩЕСТВЕННЫЙ ПРОГРЕСС', question: 'В чем проявляется проблема «Север–Юг»?', answer: 'В сильном экономическом разрыве между развитыми странами Севера и развивающимися странами Юга.' },
      { id: '28', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Кто такой индивид?', answer: 'Единичный представитель человеческого рода, носитель биологических качеств.' },
      { id: '29', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Что такое индивидуальность?', answer: 'Неповторимое своеобразие проявлений человека, подчеркивающее его исключительность.' },
      { id: '30', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Кто такой личность?', answer: 'Индивид, обладающий совокупностью социально значимых качеств, которые он реализует в общественной жизни.' },
      { id: '31', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Что такое социализация?', answer: 'Процесс усвоения индивидом социальных норм, культурных ценностей и образцов поведения общества.' },
      { id: '32', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Кто такие агенты социализации?', answer: 'Люди, социальные группы, учреждения и организации, ответственные за воспитание и обучение.' },
      { id: '33', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Приведите примеры агентов первичной социализации.', answer: 'Семья, близкие друзья, школьные учителя.' },
      { id: '34', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Приведите примеры агентов вторичной социализации.', answer: 'Администрация школы или университета, руководство на работе, государство, СМИ.' },
      { id: '35', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Что такое потребность?', answer: 'Переживаемая и осознаваемая человеком нужда в том, что необходимо для поддержания его организма и развития личности.' },
      { id: '36', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Какие выделяют три основные группы потребностей?', answer: 'Биологические (материальные), социальные, духовные (идеальные).' },
      { id: '37', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Приведите примеры биологических потребностей.', answer: 'Пища, вода, сон, дыхание, тепло, самосохранение.' },
      { id: '38', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Приведите примеры социальных потребностей.', answer: 'Общение, труд, общественное признание, принадлежность к определенной группе.' },
      { id: '39', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Приведите примеры духовных потребностей.', answer: 'Познание, творчество, поиск смысла жизни, самореализация.' },
      { id: '40', topic: 'Тема 3. ЧЕЛОВЕК, ИНДИВИД, ЛИЧНОСТЬ', question: 'Что такое мнимые (ложные) потребности?', answer: 'Потребности, удовлетворение которых ведет к физической и духовной деградации личности (алкоголь, наркотики).' },
      { id: '41', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое деятельность?', answer: 'Специфический вид человеческой активности, направленный на преобразование окружающего мира и самого себя.' },
      { id: '42', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Назовите основные структурные элементы деятельности.', answer: 'Субъект, объект, мотив, цель, средства, процесс, результат.' },
      { id: '43', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Кто такой субъект деятельности?', answer: 'Тот, кто осуществляет деятельность (человек, социальная группа, общество в целом).' },
      { id: '44', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое объект деятельности?', answer: 'То, на что направлена деятельность (предметы, процессы, другие люди).' },
      { id: '45', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое мотив деятельности?', answer: 'То, что побуждает человека к деятельности (потребности, интересы, убеждения, идеалы).' },
      { id: '46', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое цель деятельности?', answer: 'Осознанный образ желаемого (предвосхищаемого) результата.' },
      { id: '47', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Назовите основные виды деятельности.', answer: 'Игра, учение (познание), труд, общение.' },
      { id: '48', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'В чем особенность игры как вида деятельности?', answer: 'Ориентация не на результат, а на сам процесс, наличие условной воображаемой ситуации и строгих правил.' },
      { id: '49', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Какова главная цель учения как вида деятельности?', answer: 'Приобретение человеком новых знаний, умений и навыков.' },
      { id: '50', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что отличает труд от других видов деятельности?', answer: 'Направленность на достижение практически полезного результата, создание материальных и духовных благ.' },
      { id: '51', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое общение?', answer: 'Вид деятельности, при котором происходит обмен информацией, идеями, эмоциями и оценками между людьми.' },
      { id: '52', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое познание?', answer: 'Процесс постижения действительности, накопления и осмысления данных, полученных в опыте взаимодействия человека с окружающим миром.' },
      { id: '53', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Назовите два уровня (этапа) познания.', answer: 'Чувственное и рациональное познание.' },
      { id: '54', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Каковы формы чувственного познания?', answer: 'Ощущение, восприятие, представление.' },
      { id: '55', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое ощущение?', answer: 'Отражение отдельных свойств предмета, воздействующего в данный момент на органы чувств.' },
      { id: '56', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое восприятие?', answer: 'Целостный чувственный образ предмета, воздействующего в данный момент на органы чувств.' },
      { id: '57', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое представление?', answer: 'Чувственно-наглядный образ предмета, сохраняемый в памяти без его непосредственного воздействия на органы чувств.' },
      { id: '58', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Каковы формы рационального познания?', answer: 'Понятие, суждение, умозаключение.' },
      { id: '59', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое понятие?', answer: 'Мысль, фиксирующая общие и существенные признаки вещей и явлений.' },
      { id: '60', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое суждение?', answer: 'Мысль, утверждающая или отрицающая что-либо об объекте познания.' },
      { id: '61', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое умозаключение?', answer: 'Мысленная связь нескольких суждений и выведение из них логическим путем нового суждения (вывода).' },
      { id: '62', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Что такое истина?', answer: 'Знание, соответствующее свойствам познаваемого предмета, адекватное объективное отражение действительности.' },
      { id: '63', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'В чем разница между абсолютной и относительной истиной?', answer: 'Абсолютная – исчерпывающее, неизменное знание. Относительная – точное при определенных условиях, но ограниченное знание, которое может дополняться в будущем.' },
      { id: '64', topic: 'Тема 4. ДЕЯТЕЛЬНОСТЬ ЧЕЛОВЕКА', question: 'Назовите основной критерий истины.', answer: 'Общественная практика (опыт, эксперимент).' },
      { id: '65', topic: 'Тема 5. КУЛЬТУРА', question: 'Что такое культура в широком смысле?', answer: 'Всё, что создано человечеством в период его жизнедеятельности, все виды преобразовательной деятельности и её результаты.' },
      { id: '66', topic: 'Тема 5. КУЛЬТУРА', question: 'На какие две формы делится культура по своему характеру?', answer: 'Материальная и духовная культура.' },
      { id: '67', topic: 'Тема 5. КУЛЬТУРА', question: 'Что относится к материальной культуре?', answer: 'Техника, здания, одежда, орудия труда (все осязаемые результаты деятельности).' },
      { id: '68', topic: 'Тема 5. КУЛЬТУРА', question: 'Что относится к духовной культуре?', answer: 'Идеи, знания, верования, ценности, правила (все неосязаемые результаты деятельности).' },
      { id: '69', topic: 'Тема 5. КУЛЬТУРА', question: 'Назовите три типа культуры по уровню аудитории.', answer: 'Элитарная, массовая, народная культура.' },
      { id: '70', topic: 'Тема 5. КУЛЬТУРА', question: 'Для какой культуры характерны анонимность творцов и устная передача из поколения в поколение?', answer: 'Для народной культуры.' },
      { id: '71', topic: 'Тема 5. КУЛЬТУРА', question: 'Какая культура ориентирована на коммерческий успех и стандартизацию?', answer: 'Массовая культура (поп-культура).' },
      { id: '72', topic: 'Тема 6. НАУКА', question: 'Что такое наука?', answer: 'Это форма духовной культуры, направленная на выработку объективных, системно организованных и обоснованных знаний о природе, обществе и человеке.' },
      { id: '73', topic: 'Тема 6. НАУКА', question: 'Назовите основные функции науки.', answer: 'Познавательная, прогностическая, мировоззренческая и социальная.' },
      { id: '74', topic: 'Тема 6. НАУКА', question: 'Что отличает научное познание от других видов познания?', answer: 'Объективность, доказательность, системность, проверяемость и использование специального языка.' },
      { id: '75', topic: 'Тема 6. НАУКА', question: 'На какие виды делятся науки по предмету изучения?', answer: 'На естественные, точные (технические) и социально-гуманитарные.' },
      { id: '76', topic: 'Тема 6. НАУКА', question: 'На какие два уровня делится научное познание?', answer: 'На эмпирический (опытный) и теоретический уровни.' },
      { id: '77', topic: 'Тема 7. ИСКУССТВО', question: 'Что такое искусство?', answer: 'Это специфическая форма духовной культуры, представляющая собой отражение окружающей действительности в художественных образах.' },
      { id: '78', topic: 'Тема 7. ИСКУССТВО', question: 'Назовите главную особенность искусства.', answer: 'Субъективность восприятия, эмоциональность, образность и наглядность.' },
      { id: '79', topic: 'Тема 7. ИСКУССТВО', question: 'Перечислите основные функции искусства.', answer: 'Эстетическая, воспитательная, компенсаторная, познавательная и гедонистическая.' },
      { id: '80', topic: 'Тема 7. ИСКУССТВО', question: 'В чем заключается эстетическая функция искусства?', answer: 'В формировании вкуса и способности человека воспринимать, чувствовать и ценить прекрасное.' },
      { id: '81', topic: 'Тема 7. ИСКУССТВО', question: 'Что такое художественный образ?', answer: 'Это субъективное видение творцом какого-либо явления или предмета, выраженное средствами искусства.' },
      { id: '82', topic: 'Тема 8. ОБРАЗОВАНИЕ', question: 'Что такое образование?', answer: 'Это целенаправленный процесс воспитания и обучения в интересах человека, общества и государства.' },
      { id: '83', topic: 'Тема 8. ОБРАЗОВАНИЕ', question: 'Назовите основные тенденции развития современного образования.', answer: 'Гуманизация, гуманитаризация, информатизация и непрерывность.' },
      { id: '84', topic: 'Тема 8. ОБРАЗОВАНИЕ', question: 'В чем суть гуманизации образования?', answer: 'Во внимании к личности ученика, его здоровью, интересам и индивидуальным особенностям.' },
      { id: '85', topic: 'Тема 8. ОБРАЗОВАНИЕ', question: 'Какие уровни общего образования существуют в РФ?', answer: 'Дошкольное, начальное общее, основное общее и среднее общее образование.' },
      { id: '86', topic: 'Тема 8. ОБРАЗОВАНИЕ', question: 'Какова главная функция образования в обществе?', answer: 'Социализация личности и передача накопленного культурного опыта новым поколениям.' },
      { id: '87', topic: 'Тема 9. МОРАЛЬ', question: 'Что такое мораль?', answer: 'Специфический способ регулирования общественной жизни с позиций гуманизма, добра и справедливости.' },
      { id: '88', topic: 'Тема 9. МОРАЛЬ', question: 'Как звучит «золотое правило нравственности»?', answer: '«Относись к другим людям так, как хочешь, чтобы они относились к тебе».' },
      { id: '89', topic: 'Тема 9. МОРАЛЬ', question: 'Назовите три отличия морали от права.', answer: 'неписаный характер, создается обществом (а не государством), не имеет строгой юридической ответственности за нарушение.' },
      { id: '90', topic: 'Тема 9. МОРАЛЬ', question: 'В чем заключается оценочная функция морали?', answer: 'В способности давать характеристику поступкам людей с точки зрения добра и зла.' },
      { id: '91', topic: 'Тема 9. МОРАЛЬ', question: 'Что такое «социальные санкции»?', answer: 'Меры одобрения или порицания (позитивные и негативные), применяемые обществом для регуляции поведения индивида.' },
      { id: '92', topic: 'Тема 10. РЕЛИГИЯ', question: 'Дайте определение религии.', answer: 'Это форма духовной культуры и мировоззрение, основанное на вере в существование сверхъестественных сил.' },
      { id: '93', topic: 'Тема 10. РЕЛИГИЯ', question: 'Назовите три мировые религии.', answer: 'буддизм, христианство и ислам.' },
      { id: '94', topic: 'Тема 10. РЕЛИГИЯ', question: 'Чем монотеистические религии отличаются от политеистических?', answer: 'Монотеизм – это вера в одного Бога, политеизм – вера во многих богов.' },
      { id: '95', topic: 'Тема 10. РЕЛИГИЯ', question: 'Является ли буддизм монотеистической религией?', answer: 'Нет, буддизм не признает Бога-творца; Будда является духовным учителем, а не Богом.' },
      { id: '96', topic: 'Тема 10. РЕЛИГИЯ', question: 'В чем заключается компенсаторная функция религии?', answer: 'В оказании психологической помощи, дарении надежды и утешения в трудные моменты жизни.' },
      { id: '97', topic: 'Тема 10. РЕЛИГИЯ', question: 'Что такое «конфессия»?', answer: 'Это отдельное направление или школа внутри одной конкретной религии (например, православие, католицизм и протестантизм в христианстве).' }
    ];

      btnNext: document.getElementById('btn-next'),
      btnPrev: document.getElementById('btn-prev'),
      btnShuffle: document.getElementById('btn-shuffle')
    };

    // Функция масштабирования текста под размер карточки
    function scaleTextToFit() {
      // Используем requestAnimationFrame для надежного пересчета после обновления DOM
      requestAnimationFrame(() => {
        // Сбрасываем инлайн-стили перед пересчетом
        els.cardQuestion.style.fontSize = '';
        els.cardAnswer.style.fontSize = '';

        const frontFace = document.querySelector('.card-front');
        const backFace = document.querySelector('.card-back');

        const fitText = (container, textElement) => {
          let fontSize = parseFloat(window.getComputedStyle(textElement).fontSize);
          const minFontSize = 14; // Минимально читаемый размер шрифта

          // Пока контент не помещается по высоте и шрифт больше минимального – плавно уменьшаем
          while (container.scrollHeight > container.clientHeight && fontSize > minFontSize) {
            fontSize -= 0.5;
            textElement.style.fontSize = fontSize + 'px';
          }
        };

        // Вызываем масштабирование для обеих сторон
        fitText(frontFace, els.cardQuestion);
        fitText(backFace, els.cardAnswer);
      });
    }

    // Пересчет при повороте или изменении размера экрана
    window.addEventListener('resize', scaleTextToFit);

    // Фильтрация
    function getFilteredCards() {
      return cards.filter(card => {
        if (activeTab === 'learned') return learnedIds.has(card.id);
        if (activeTab === 'learning') return !learnedIds.has(card.id);
        return true;
      });
    }

    // Обновление интерфейса
    function updateUI() {
      // Обновляем счетчики на вкладках
      els.tabAll.textContent = `Все термины (${cards.length})`;
      els.tabLearning.textContent = `Осталось выучить (${cards.length - learnedIds.size})`;
      els.tabLearned.textContent = `Выученные (${learnedIds.size})`;

      const filtered = getFilteredCards();

      if (filtered.length === 0) {
        els.mainContent.style.display = 'none';
        els.emptyState.style.display = 'block';
      } else {
        els.mainContent.style.display = 'flex';
        els.emptyState.style.display = 'none';

        // Корректировка индекса, если он вышел за пределы
        if (currentIndex >= filtered.length) currentIndex = 0;

        const currentCard = filtered[currentIndex];
        els.cardQuestion.textContent = currentCard.question;
        els.cardAnswer.textContent = currentCard.answer;
        els.statusText.textContent = `Карточка ${currentIndex + 1} из ${filtered.length}`;

        // Добавляем подсказку с темой, если она есть
        if (currentCard.topic) {
          els.cardTopicHint.innerHTML = `<svg class="icon icon-sm"><use href="#icon-book"></use></svg> <span>подсказка: если ошиблись, повторите раздел «${currentCard.topic}»</span>`;
          els.cardTopicHint.style.display = 'flex';
        } else {
          els.cardTopicHint.style.display = 'none';
        }

        // Статус "Выучено"
        if (learnedIds.has(currentCard.id)) {
          els.btnCheck.classList.add('active');
          els.btnCheck.title = 'Убрать из выученных';
        } else {
          els.btnCheck.classList.remove('active');
          els.btnCheck.title = 'Отметить как выученное';
        }

        // Запускаем автоматическое масштабирование текста
        scaleTextToFit();
      }
    }

    // Обработчики вкладок
    function switchTab(tabId) {
      activeTab = tabId;
      currentIndex = 0;
      isFlipped = false;
      els.cardWrapper.classList.remove('flipped');
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      
      updateUI();
    }

    els.tabAll.addEventListener('click', () => switchTab('all'));
    els.tabLearning.addEventListener('click', () => switchTab('learning'));
    els.tabLearned.addEventListener('click', () => switchTab('learned'));

    // Переворот карточки
    els.cardWrapper.addEventListener('click', () => {
      isFlipped = !isFlipped;
      els.cardWrapper.classList.toggle('flipped', isFlipped);
    });

    // Навигация
    els.btnNext.addEventListener('click', () => {
      const filtered = getFilteredCards();
      if (filtered.length <= 1) return;
      isFlipped = false;
      els.cardWrapper.classList.remove('flipped');
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % filtered.length;
        updateUI();
      }, 150);
    });

    els.btnPrev.addEventListener('click', () => {
      const filtered = getFilteredCards();
      if (filtered.length <= 1) return;
      isFlipped = false;
      els.cardWrapper.classList.remove('flipped');
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + filtered.length) % filtered.length;
        updateUI();
      }, 150);
    });

    els.btnShuffle.addEventListener('click', () => {
      const filtered = getFilteredCards();
      if (filtered.length <= 1) return;
      isFlipped = false;
      els.cardWrapper.classList.remove('flipped');
      setTimeout(() => {
        // Перемешиваем массив карточек
        cards.sort(() => Math.random() - 0.5);
        currentIndex = 0;
        updateUI();
      }, 150);
    });

    els.btnCheck.addEventListener('click', () => {
      const filtered = getFilteredCards();
      if (filtered.length === 0) return;
      const currentCard = filtered[currentIndex];
      
      if (learnedIds.has(currentCard.id)) {
        learnedIds.delete(currentCard.id);
      } else {
        learnedIds.add(currentCard.id);
      }
      updateUI();
    });

    // Темная тема
    els.btnTheme.addEventListener('click', () => {
      theme = theme === 'light' ? 'dark' : 'light';
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        els.themeIconUse.setAttribute('href', '#icon-sun');
      } else {
        document.documentElement.removeAttribute('data-theme');
        els.themeIconUse.setAttribute('href', '#icon-moon');
      }
    });

    // Загрузка файла
    els.btnUpload.addEventListener('click', () => els.fileInput.click());
    
    els.fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        const parsed = parseCSV(text);
        if (parsed.length > 0) {
          cards = parsed;
          learnedIds.clear();
          currentIndex = 0;
          isFlipped = false;
          els.cardWrapper.classList.remove('flipped');
          els.fileStatusText.textContent = `Загружен файл: ${file.name}`;
          updateUI();
        } else {
          alert('Не удалось распознать карточки. Убедитесь, что формат правильный.');
        }
      };
      reader.readAsText(file);
    });

    // Парсер CSV с поддержкой трех колонок: Вопрос, Ответ, Тема (опционально)
    function parseCSV(text) {
      const result = [];
      let row = [];
      let inQuotes = false;
      let currentVal = '';
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"' && text[i + 1] === '"') {
            currentVal += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentVal += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(currentVal.trim());
            currentVal = '';
          } else if (char === '\n' || char === '\r') {
            row.push(currentVal.trim());
            if (row.length >= 2 && row[0] && row[1]) {
              result.push({ 
                id: Date.now() + Math.random().toString(), 
                question: row[0], 
                answer: row[1],
                topic: row[2] ? row[2] : '' // Добавлена поддержка третьей колонки (Тема)
              });
            }
            row = [];
            currentVal = '';
            if (char === '\r' && text[i + 1] === '\n') i++;
          } else {
            currentVal += char;
          }
        }
      }
      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        if (row.length >= 2 && row[0] && row[1]) {
          result.push({ 
            id: Date.now() + Math.random().toString(), 
            question: row[0], 
            answer: row[1],
            topic: row[2] ? row[2] : ''
          });
        }
      }
      return result;
    }

    // Инициализация при старте
    updateUI();
  </script>
</body>
</html>
